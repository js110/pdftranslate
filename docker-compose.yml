x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /tmp/pdftranslate/sessions
  SESSION_TTL_MINUTES: 120
  MAX_UPLOAD_MB: 30
  RENDER_DPI: 160
  HIGH_PRIORITY_QUEUE: page_high
  NORMAL_PRIORITY_QUEUE: page_normal
  MAX_RETRIES_PER_PROVIDER: 1
  BATCH_SEGMENT_SIZE: 36
  BATCH_SEGMENT_CHAR_LIMIT: 8000
  TRANSLATION_TEMPERATURE: 0.2
  ENABLE_STRICT_LOW_QUALITY_RETRY: "true"
  CLEAR_TRANSLATION_MEMORY_ON_RETRY: "true"
  ENABLE_LAYOUT_DETECTION_GUARD: "true"
  LAYOUT_DETECTION_LANG: en
  ENABLE_GROBID_REFERENCE_GUARD: "false"
  GROBID_BASE_URL: ""
  GROBID_TIMEOUT_SEC: 30
  # --- Image OCR (disabled by default) ---
  # Set ENABLE_IMAGE_OCR=true to use local PaddleOCR for image text extraction.
  # Requires paddleocr+paddlepaddle (already in requirements.txt).
  ENABLE_IMAGE_OCR: "false"
  # Set ENABLE_REMOTE_IMAGE_OCR=true + REMOTE_OCR_TOKEN to use Baidu PaddleOCR
  # Cloud API as fallback when local OCR fails or is unavailable.
  ENABLE_REMOTE_IMAGE_OCR: "true"
  REMOTE_OCR_JOB_URL: https://paddleocr.aistudio-app.com/api/v2/ocr/jobs
  REMOTE_OCR_TOKEN: ${REMOTE_OCR_TOKEN:-}  # Set in .env file
  REMOTE_OCR_MODEL: PaddleOCR-VL-1.6
  REMOTE_OCR_TIMEOUT_SEC: 30
  REMOTE_OCR_POLL_INTERVAL_SEC: 5
  REMOTE_OCR_MAX_WAIT_SEC: 180
  REMOTE_OCR_USE_DOC_ORIENTATION_CLASSIFY: "false"
  REMOTE_OCR_USE_DOC_UNWARPING: "false"
  REMOTE_OCR_USE_CHART_RECOGNITION: "false"

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    volumes:
      - ./runtime-data:/tmp/pdftranslate/sessions
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "celery_worker.celery_app",
        "worker",
        "-Q",
        "page_high,page_normal",
        "--concurrency=4",
        "--loglevel=info"
      ]
    environment:
      <<: *common-env
    volumes:
      - ./runtime-data:/tmp/pdftranslate/sessions
    depends_on:
      - redis

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/v1
        VITE_DEFAULT_PRIMARY_ID: deepseek-main
        VITE_DEFAULT_PRIMARY_MODEL: deepseek-chat
        VITE_DEFAULT_PRIMARY_BASE_URL: https://api.deepseek.com/v1
        VITE_DEFAULT_PRIMARY_API_KEY: ${VITE_DEFAULT_PRIMARY_API_KEY:-}
        VITE_DEFAULT_BACKUP_ID: qwen-backup
        VITE_DEFAULT_BACKUP_MODEL: qwen-plus
        VITE_DEFAULT_BACKUP_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
        VITE_DEFAULT_BACKUP_API_KEY: ${VITE_DEFAULT_BACKUP_API_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - api
